<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Physician review and digital signature</title>
  <desc id="desc">A physician reviews a completed report on screen and applies a secure digital signature with an approval certificate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f7f8fa"/>
      <stop offset="1" stop-color="#dce3e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#17283d" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="46" fill="url(#bg)"/>
  <path d="M0 746c281-39 513-18 757 34 268 58 537 51 843-22v142H0Z" fill="#d4dce2"/>

  <!-- Physician at workstation -->
  <circle cx="286" cy="240" r="82" fill="#e4b9a2"/>
  <path d="M217 238c-2-67 44-110 98-95 51 14 75 55 63 116-23-3-54-23-76-54-20 25-52 36-85 33Z" fill="#26394d"/>
  <path d="M246 314c23 18 61 18 85 0v74h-85Z" fill="#dbaa94"/>
  <path d="M97 791c7-201 64-338 184-402 92 40 153 166 171 402Z" fill="#f8fafb" stroke="#bac7d2" stroke-width="7"/>
  <path d="M201 420c27 22 54 33 81 35 27-2 55-13 84-35l-27-43c-36 25-75 25-111 0Z" fill="#cad6df"/>
  <path d="M203 493v173m155-173v173" stroke="#657b8e" stroke-width="7"/>
  <path d="M193 664c0-55 29-85 65-85s65 30 65 85" fill="none" stroke="#52687b" stroke-width="10"/>
  <circle cx="323" cy="663" r="17" fill="#e34a30"/>
  <path d="M417 565c50 25 91 62 131 108l100 113H489l-109-85" fill="#e5b9a3" stroke="#bd8d78" stroke-width="5"/>

  <!-- Review monitor -->
  <g filter="url(#shadow)">
    <rect x="530" y="92" width="964" height="630" rx="34" fill="#fff" stroke="#b9c5cf" stroke-width="7"/>
  </g>
  <path d="M565 92h894c19 0 35 16 35 35v66H530v-66c0-19 16-35 35-35Z" fill="#17283d"/>
  <circle cx="584" cy="143" r="12" fill="#e34a30"/>
  <circle cx="622" cy="143" r="12" fill="#ffb5a4"/>
  <circle cx="660" cy="143" r="12" fill="#8194a5"/>
  <rect x="710" y="127" width="241" height="30" rx="15" fill="#40556a"/>

  <!-- Signed report on screen -->
  <rect x="574" y="231" width="564" height="438" rx="18" fill="#f7f9fa" stroke="#c4d0d9" stroke-width="3"/>
  <rect x="611" y="267" width="229" height="24" rx="12" fill="#263a50"/>
  <rect x="611" y="323" width="473" height="16" rx="8" fill="#8295a5"/>
  <rect x="611" y="359" width="419" height="16" rx="8" fill="#a2b1bd"/>
  <rect x="611" y="395" width="447" height="16" rx="8" fill="#a2b1bd"/>
  <rect x="611" y="452" width="473" height="113" rx="14" fill="#e9eef2"/>
  <rect x="640" y="479" width="374" height="14" rx="7" fill="#7e92a3"/>
  <rect x="640" y="511" width="319" height="14" rx="7" fill="#9cadbb"/>
  <path d="M638 624c24-32 7-34 10-12 3 21 30-31 34-9 3 20 21-9 34 6 10 12 37 9 59 9" fill="none" stroke="#e34a30" stroke-width="6" stroke-linecap="round"/>
  <circle cx="1038" cy="615" r="30" fill="#e34a30"/>
  <path d="m1024 615 11 12 23-28" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Explicit digital-signature panel -->
  <rect x="1174" y="231" width="276" height="438" rx="20" fill="#eef2f5" stroke="#c4d0d9" stroke-width="3"/>
  <circle cx="1312" cy="321" r="63" fill="#17283d"/>
  <path d="M1276 286h72v61h-72Z" fill="none" stroke="#fff" stroke-width="7"/>
  <path d="M1293 286v-14c0-24 38-24 38 0v14" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <path d="m1292 320 14 15 29-34" fill="none" stroke="#ff9f88" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1211" y="413" width="202" height="19" rx="9" fill="#263a50"/>
  <rect x="1237" y="454" width="150" height="14" rx="7" fill="#8799a9"/>
  <rect x="1220" y="489" width="184" height="14" rx="7" fill="#a4b2bd"/>
  <rect x="1220" y="528" width="184" height="78" rx="17" fill="#e34a30"/>
  <path d="m1248 568 15 16 35-42" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1321" y="557" width="55" height="20" rx="10" fill="#fff" opacity=".9"/>

  <!-- Digital trust trail, clearly not paper-and-pen -->
  <path d="M1312 669v52c0 31-25 57-57 57H742" fill="none" stroke="#e34a30" stroke-width="7" stroke-dasharray="15 13"/>
  <circle cx="735" cy="778" r="31" fill="#e34a30"/>
  <path d="m720 778 12 13 27-32" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="768" y="759" width="261" height="38" rx="19" fill="#17283d"/>
  <rect x="797" y="769" width="202" height="18" rx="9" fill="#fff" opacity=".9"/>
  <path d="M658 722v56" stroke="#677c8f" stroke-width="20" stroke-linecap="round"/>
  <path d="M571 784h176" stroke="#677c8f" stroke-width="22" stroke-linecap="round"/>
</svg>
