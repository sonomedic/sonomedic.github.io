<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shoulder ultrasound acquisition guidance</title>
  <desc id="desc">A clinician places an ultrasound probe on a patient's shoulder while the monitor guides the probe toward a standard plane.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f7f8fa"/>
      <stop offset="1" stop-color="#dfe5ea"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#24374d"/>
      <stop offset="1" stop-color="#101a28"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#17283d" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="46" fill="url(#bg)"/>
  <path d="M0 696C278 631 483 674 712 737s496 79 888-7v170H0Z" fill="#d5dce2"/>

  <!-- Patient and shoulder -->
  <circle cx="337" cy="247" r="91" fill="#e5bda8"/>
  <path d="M274 225c7-77 123-98 157-24 10 21 12 53 1 77-8-30-36-41-50-67-22 24-73 28-108 14Z" fill="#26394d"/>
  <path d="M284 326c29 21 83 24 111 0v82h-111Z" fill="#dfae97"/>
  <path d="M137 780c10-211 60-349 167-389 80-30 192 0 254 93 55 82 60 193 63 296Z" fill="#f6f8fa" stroke="#bcc8d2" stroke-width="7"/>
  <path d="M316 397c-44 12-75 36-98 72 94 25 179 29 274-2-30-40-72-64-121-72-18 19-36 26-55 2Z" fill="#cbd7e0"/>
  <path d="M504 484c64 63 84 169 90 296H426c7-100 20-198 78-296Z" fill="#e9eef2"/>
  <path d="M420 443c69-8 124 18 165 71" fill="none" stroke="#9dadbb" stroke-width="6" stroke-linecap="round"/>

  <!-- Clinician hand and probe on shoulder -->
  <path d="M678 246c-54 35-90 75-111 121l-59 130c-9 21 1 46 22 55l45 19c22 9 47-2 55-24l47-128c14-38 40-67 77-86Z" fill="#e7bca5" stroke="#bd8d78" stroke-width="5"/>
  <g transform="translate(527 397) rotate(20 78 94)" filter="url(#shadow)">
    <rect x="21" y="5" width="114" height="125" rx="38" fill="#fbfcfd" stroke="#74889a" stroke-width="6"/>
    <rect x="31" y="18" width="94" height="31" rx="13" fill="#e34a30"/>
    <path d="M49 125h59l-7 49H56Z" fill="#d5dee5" stroke="#74889a" stroke-width="5"/>
    <rect x="53" y="168" width="51" height="20" rx="8" fill="#17283d"/>
  </g>
  <path d="M630 586C596 668 637 720 716 736" fill="none" stroke="#52687b" stroke-width="14" stroke-linecap="round"/>

  <!-- Ultrasound monitor -->
  <g filter="url(#shadow)">
    <rect x="802" y="112" width="674" height="568" rx="34" fill="#eef2f5" stroke="#bac6d0" stroke-width="7"/>
    <rect x="834" y="150" width="610" height="444" rx="18" fill="url(#screen)"/>
  </g>
  <path d="M1138 680v78m-121 0h242" stroke="#677c8f" stroke-width="22" stroke-linecap="round"/>

  <!-- Concrete ultrasound image -->
  <path d="M868 513c76-188 194-255 335-213 82 24 152 93 207 209" fill="#18283b" stroke="#8398aa" stroke-width="4"/>
  <path d="M872 514c91-119 193-152 307-95 69 34 130 77 218 91M886 481c91-96 183-111 279-61 77 40 135 68 220 73M916 437c71-71 149-80 237-42" fill="none" stroke="#dbe3e8" stroke-width="8" opacity=".72"/>
  <path d="M985 457c41-80 120-111 219-77 66 22 110 68 143 113" fill="none" stroke="#ffad99" stroke-width="8"/>
  <rect x="973" y="282" width="294" height="238" rx="14" fill="none" stroke="#ff8d73" stroke-width="6" stroke-dasharray="18 13"/>
  <path d="M973 318v-36h36M1231 282h36v36M973 484v36h36M1231 520h36v-36" fill="none" stroke="#ff8d73" stroke-width="10"/>
  <circle cx="1120" cy="400" r="12" fill="#fff"/>
  <path d="M1093 400h54m-27-27v54" stroke="#fff" stroke-width="5" stroke-linecap="round"/>

  <!-- Guidance status -->
  <rect x="866" y="178" width="238" height="62" rx="31" fill="#e34a30"/>
  <circle cx="906" cy="209" r="14" fill="#fff"/>
  <path d="m899 209 6 7 12-15" fill="none" stroke="#e34a30" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="934" y="197" width="134" height="23" rx="11" fill="#fff" opacity=".94"/>
  <path d="M1318 199h83M1359 178v42" stroke="#91a4b4" stroke-width="6" stroke-linecap="round"/>

  <!-- Probe-direction cue links shoulder to target -->
  <path d="M683 398C753 319 829 300 930 326" fill="none" stroke="#e34a30" stroke-width="7" stroke-dasharray="15 15"/>
  <path d="m906 300 29 27-37 14" fill="none" stroke="#e34a30" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
